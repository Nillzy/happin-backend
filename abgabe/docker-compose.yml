services:
  backend:
    image: registry.gitlab.com/dhbw-se/se-tinf24b2/happin/backend/backend:latest
    container_name: happin-backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    image: registry.gitlab.com/dhbw-se/se-tinf24b2/happin/frontend/frontend:latest
    container_name: happin-frontend
    ports:
      - "8080:80"
    env_file:
      - ./frontend.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
