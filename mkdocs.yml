site_name: Happin Backend
site_url: https://dhbw-se.gitlab.io/se-tinf24b2/happin/backend
site_description: Dokumentation des Happin-Backends – FastAPI-basierte REST-API für die Happin-Eventplattform
site_author: Happin-Team
docs_dir: docs
site_dir: site
theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Zum dunklen Modus wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Zum hellen Modus wechseln
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Startseite: index.md
  - Backend-Komponenten:
    - Überblick: components/index.md
    - API-Adapter: components/api-adapter.md
    - Authentication: components/authentication.md
    - Anwendungskern:
      - Überblick: components/anwendungskern.md
      - EventInfo: components/eventinfo.md
      - EventAdmin: components/eventadmin.md
      - RSVP: components/rsvp.md
      - HostDashboard: components/hostdashboard.md
      - Notification: components/notification.md
      - PublicList: components/publiclist.md
      - Ticketing: components/ticketing.md
    - DatabaseAdapter: components/database-adapter.md
    - MessagingAdapter: components/messaging-adapter.md
    - PaymentAdapter: components/payment-adapter.md
    - MapsAdapter: components/maps-adapter.md
    - WeatherAdapter: components/weather-adapter.md
    - TicketGenerationAdapter: components/ticket-generation-adapter.md
  - API-Referenz: api/index.html
  - Architekturentwurf: architecture.md
